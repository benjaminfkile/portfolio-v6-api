name: Build and Deploy Portfolio v6 API

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "**/*.md"

env:
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
  # Branch-unique suffix for the immutable per-build tag so that a dev
  # build of the same commit can never overwrite the :<sha> tag a prod
  # deploy just pinned (and vice versa).
  IMMUTABLE_TAG_SUFFIX: ${{ github.ref_name == 'main' && '-prod' || '-dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push multi-arch Docker image
        run: |
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
          GIT_SHA=$(git rev-parse --short HEAD)
          IMMUTABLE_TAG=${GIT_SHA}${{ env.IMMUTABLE_TAG_SUFFIX }}

          echo "Initializing Buildx for multi-architecture build..."
          docker buildx create --use || true
          docker buildx inspect --bootstrap

          echo "Building and pushing Portfolio v6 API Docker image..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg AWS_REGION=${{ secrets.AWS_REGION }} \
            --build-arg AWS_SECRET_ARN=${{ secrets.AWS_SECRET_ARN }} \
            --build-arg AWS_DB_SECRET_ARN=${{ secrets.AWS_DB_SECRET_ARN }} \
            --build-arg NODE_ENV=production \
            -t $IMAGE_URI:$IMMUTABLE_TAG \
            -t $IMAGE_URI:${{ env.IMAGE_TAG }} \
            --push .

      # Deploy = one authenticated call to the gateway's management API
      # (machine credential, deploy-only scope). The gateway resolves the tag
      # to a digest, updates the manifest, and blue-greens the container in
      # place — no instance refresh.
      - name: Deploy via gateway
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          IMMUTABLE_TAG=${GIT_SHA}${{ env.IMMUTABLE_TAG_SUFFIX }}
          SERVICE=${{ github.ref_name == 'main' && 'portfolio-v6-api' || 'portfolio-v6-api-dev' }}

          TOKEN=$(curl -sf -X POST "${{ secrets.MGMT_TOKEN_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.MGMT_CLIENT_ID }}:${{ secrets.MGMT_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials&scope=mgmt/deploy" | jq -r .access_token)

          echo "Deploying ${SERVICE} @ ${IMMUTABLE_TAG} via gateway..."
          curl -sf -X POST "https://api.benkile.com/mgmt/services/${SERVICE}/deploy" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${IMMUTABLE_TAG}\"}"
